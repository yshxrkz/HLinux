name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash gets -o pipefail as well as -e.
    shell: bash

jobs:
  lint:
    name: Lint (shellcheck, hadolint, actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck harden-audit.sh lib/*.sh lib/controls/*.sh tests/*.sh docker/*.sh

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  host-tests:
    name: Host tests (read-only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace openssh-server

      - name: Scenario tests
        run: sudo tests/run-tests.sh

      # A real (read-only) audit of the runner VM, which unlike the container
      # runs systemd. Exit 1 just means some controls fail; 2 would be an error.
      - name: Audit the runner itself
        run: |
          mkdir -p reports
          rc=0
          sudo ./harden-audit.sh audit --report reports/runner-audit.html || rc=$?
          sudo ./harden-audit.sh harden --dry-run --no-color | tee reports/runner-dry-run.txt
          test "$rc" -le 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-audit
          path: reports/
          if-no-files-found: ignore

  container-tests:
    name: End-to-end tests in the Ubuntu demo container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the demo image and run the tests inside it
        run: tests/docker-test.sh reports

      - name: Add the hardened report to the job summary
        if: always()
        run: |
          if [ -f reports/after.md ]; then
            cat reports/after.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-reports
          path: reports/
          if-no-files-found: ignore
